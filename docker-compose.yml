version: "3.8"
services:
  nginx:
    image: ghcr.io/0x3654/nginx-3x-ui-subscription-proxy:latest
    container_name: nginx_proxy_sub
    env_file:
      - .env
    ports:
      - ${SITE_PORT}:${SITE_PORT}
    volumes:
      - ${PATH_SSL_KEY}/fullchain.pem:/etc/nginx/ssl/fullchain.pem
      - ${PATH_SSL_KEY}/privkey.pem:/etc/nginx/ssl/privkey.pem
    restart: always
